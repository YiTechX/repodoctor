name: RepoDoctor
description: Audit repository health and fail the build when the score drops below a threshold
author: RepoDoctor contributors
branding:
  icon: activity
  color: green
inputs:
  path:
    description: Directory to audit
    default: "."
  fail-under:
    description: Fail when the score is below this value
    default: "0"
  python-version:
    description: Python version used to run RepoDoctor
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install RepoDoctor
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ACTION_PATH"
    - name: Publish job summary
      shell: bash
      env:
        AUDIT_PATH: ${{ inputs.path }}
      run: repodoctor scan "$AUDIT_PATH" --format markdown >> "$GITHUB_STEP_SUMMARY"
    - name: Audit repository
      shell: bash
      env:
        AUDIT_PATH: ${{ inputs.path }}
        FAIL_UNDER: ${{ inputs.fail-under }}
      run: repodoctor scan "$AUDIT_PATH" --fail-under "$FAIL_UNDER" --no-color
